# Builds the standalone Mac app for Apple silicon (arm64): a zip containing Keybo.app, ready to double-click.
# PyInstaller can only build for the CPU it runs on, and GitHub's macOS runners are Apple silicon, so this
# gives an arm64 build; an Intel (x86_64) build still has to be made by hand on an Intel Mac (scripts/build_mac.sh).
#   - On a version tag (v0.11.0) the zip is added to the DRAFT release that release.yml creates.
#   - By hand (Actions tab, "Run workflow") or in a pull request that touches the packaging: a test build,
#     with the file kept for 14 days under the run's "Artifacts".
# The app is only ad-hoc signed (a paid Apple Developer ID is needed for more), so macOS refuses to open it the
# first time; the README explains how to continue (System Settings, Privacy & Security, Open Anyway).
name: Mac app

on:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/launch.py"
      - "scripts/check_window.py"
      - "backend/config.py"
      - "requirements*.txt"
      - ".github/workflows/mac-app.yml"
  workflow_dispatch:
  workflow_call:            # the release workflow (release.yml) builds the app through this file

permissions:
  contents: read

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Mac app (Apple silicon)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: pip install --require-hashes -r requirements.lock
      - name: Version and CPU
        run: |
          echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          echo "APP_ARCH=$(uname -m)" >> "$GITHUB_ENV"
      - name: Build the app (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/app.spec
      - name: Test the app
        run: packaging/smoke_mac.sh dist/Keybo.app/Contents/MacOS/Keybo
      - name: Test the app's own window (loads, sound, Exit quits, no browser)
        run: python scripts/check_window.py dist/Keybo.app/Contents/MacOS/Keybo

      - name: Zip it and write a checksum
        run: |
          cd dist
          ZIP="Keybo-$APP_VERSION-macos-$APP_ARCH.zip"
          ditto -c -k --keepParent Keybo.app "$ZIP"        # ditto keeps the app's permissions and signature intact
          shasum -a 256 "$ZIP" > SHA256SUMS-mac.txt
          cat SHA256SUMS-mac.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: app-mac-${{ env.APP_ARCH }}-${{ env.APP_VERSION }}
          path: |
            dist/Keybo-*-macos-*.zip
            dist/SHA256SUMS-mac.txt
          retention-days: 14
