# Builds the standalone Linux app (x86_64): a .tar.gz with a Keybo folder; run ./Keybo/Keybo inside it.
# docs/DESIGN.md section 4.6: "Produce a Windows .exe first; add macOS and Linux after." See docs/BUILD.md.
#   - On a version tag (v0.11.0) the file is added to the DRAFT release that release.yml creates.
#   - By hand (Actions tab, "Run workflow") or in a pull request that touches the packaging: a test build,
#     with the file kept for 14 days under the run's "Artifacts".
# The app opens Keybo in Chrome or Chromium in kiosk mode when one is installed, otherwise in the normal browser.
name: Linux app

on:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/launch.py"
      - "backend/config.py"
      - "requirements*.txt"
      - ".github/workflows/linux-app.yml"
  workflow_dispatch:
  workflow_call:            # the release workflow (release.yml) builds the app through this file

permissions:
  contents: read

concurrency:
  group: linux-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Linux app (x86_64)
    runs-on: ubuntu-22.04        # an older base system, so the app also runs on older Linux versions
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: pip install --require-hashes -r requirements.lock
      - name: Version
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Build the app (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/app.spec
      - name: Test the app
        run: packaging/smoke_mac.sh dist/Keybo/Keybo        # plain bash and curl: the same check works on Linux

      - name: Pack it and write a checksum
        run: |
          cd dist
          FILE="Keybo-$APP_VERSION-linux-x86_64.tar.gz"
          tar -czf "$FILE" Keybo
          sha256sum "$FILE" > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: app-linux-${{ env.APP_VERSION }}
          path: |
            dist/Keybo-*-linux-*.tar.gz
            dist/SHA256SUMS-linux.txt
          retention-days: 14
