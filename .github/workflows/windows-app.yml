# Builds the standalone Windows app: Keybo-Setup-<version>.exe (one installer file to share) and a portable zip.
# PyInstaller can only build for the system it runs on, so this runs on a Windows machine in the cloud.
#   - On a version tag (v0.11.0) the files are added to the DRAFT release that release.yml creates.
#   - By hand (Actions tab, "Run workflow") or in a pull request that touches the packaging: a test build,
#     with the files kept for 14 days under the run's "Artifacts".
# The app is not signed (that needs a paid certificate), so Windows shows a blue "protected your PC" warning the
# first time; the README explains how to continue.
name: Windows app

on:
  pull_request:
    paths:
      - "packaging/**"
      - "windows/**"
      - "scripts/launch.py"
      - "scripts/check_window.py"
      - "backend/config.py"
      - "requirements*.txt"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:
  workflow_call:            # the release workflow (release.yml) builds the app through this file

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: pip install --require-hashes -r requirements.lock
      - name: Version
        shell: bash
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Build the app folder (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/app.spec
      - name: Test the app folder
        run: powershell -File windows/smoke-test.ps1 -Exe dist\Keybo\Keybo.exe
      - name: Test the app's own window (loads, sound, Exit quits, no browser)
        run: python scripts/check_window.py dist\Keybo\Keybo.exe

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Test the installer (install silently, start, uninstall)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "app-installed"
          $setup = Start-Process -FilePath "dist\Keybo-Setup-$env:APP_VERSION.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOICONS","/DIR=$target" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "The installer failed with code $($setup.ExitCode)" }
          powershell -File windows/smoke-test.ps1 -Exe (Join-Path $target "Keybo.exe")
          if ($LASTEXITCODE -ne 0) { throw "The installed app failed its test" }
          $un = Start-Process -FilePath (Join-Path $target "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "The uninstaller failed" }

      - name: Portable zip and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Keybo -DestinationPath "dist\Keybo-$env:APP_VERSION-windows-portable.zip"
          Set-Location dist
          Get-FileHash "Keybo-Setup-$env:APP_VERSION.exe", "Keybo-$env:APP_VERSION-windows-portable.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: app-windows-${{ env.APP_VERSION }}
          path: |
            dist/Keybo-Setup-*.exe
            dist/Keybo-*-windows-portable.zip
            dist/SHA256SUMS-windows.txt
          retention-days: 14
