# Continuous integration: runs on every pull request (including pull requests from forks, which get no secrets:
# nothing here uses any) and every push to main.
# It runs exactly what the git hooks run (scripts/check.sh), so "green" here means
# "the same checks you ran on your own computer passed on a clean machine".
name: CI

on:
  push:
    branches: [main]
  pull_request:                # never pull_request_target: fork code must not run with this repository's rights
  workflow_dispatch:        # lets you start it by hand from the Actions tab

# The workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install (from the lockfile)
        run: pip install --require-hashes -r requirements.lock
      - name: Ruff (real mistakes only, see ruff.toml)
        run: ruff check .

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0                  # the whole history, not only the last commit
          persist-credentials: false
      - name: Install gitleaks (the official release, checked against its published checksum)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan every commit for secrets
        run: ./gitleaks git --redact --no-banner --log-opts="--all" .

  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install (from the lockfile)
        run: pip install --require-hashes -r requirements.lock
      - name: requirements.lock matches requirements*.txt (after a Dependabot bump, run scripts/lock.sh)
        run: scripts/lock.sh && git diff --exit-code requirements.lock

  checks:
    name: Checks (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }   # the oldest Python the README promises
          - { os: ubuntu-latest, python: "3.13" }   # the one used for development
          - { os: macos-latest,  python: "3.13" }   # the parent's operating system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (for the JavaScript and text checks)
        with:
          node-version: 22
      - name: Install
        run: pip install --require-hashes -r requirements.lock
      - name: Run all checks (secrets, syntax, texts, tests)
        run: scripts/check.sh

  browser:
    name: Browser tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: pip install --require-hashes -r requirements.lock
      - name: Show which Chrome is used
        run: google-chrome --version
      # Plays every level in English and German, stresses it like a child would, and checks the
      # break, the daily limit and the parent area in headless Chrome (see tests/browser).
      - name: Play the real app in headless Chrome
        run: python -m pytest -m browser -v

  windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: pip install --require-hashes -r requirements.lock
      # Windows families get Keybo too, so the automatic tests and a fresh start must work there.
      - name: Automatic tests
        run: python -m pytest -q
      - name: The server starts and serves the first-run setup
        shell: bash
        run: |
          APP_DB_PATH="$RUNNER_TEMP/app.db" LLM_MODE=off PARENT_PIN= python -m uvicorn backend.app:create_app --factory --port 8765 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/settings > settings.json && break; sleep 1; done
          cat settings.json; echo
          grep -q '"setup_needed":true' settings.json
          curl -sf -o /dev/null http://127.0.0.1:8765/ && echo "index page served"

  package:
    name: Build the zip
    needs: [checks, browser, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Build Keybo-<version>.zip
        run: python scripts/make_zip.py
      - name: Check the zip contents
        run: scripts/check_zip.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: app-zip
          path: Keybo-*.zip
          retention-days: 14
