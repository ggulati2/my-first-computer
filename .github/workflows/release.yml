# Release pipeline, started only by a version tag (v1.2.3) on a commit on main. It:
#   1. checks the tag matches the VERSION file and is on main, and runs every check,
#   2. builds the source zip, the Mac, Windows and Linux apps (each with read-only permissions),
#   3. in the protected "release" environment (the maintainer approves it): writes SHA256SUMS.txt, adds signed
#      build-provenance attestations for every file, and creates a DRAFT GitHub release.
# Nothing is public until the maintainer opens the draft on GitHub and clicks "Publish release".
# Verify a download:  gh attestation verify <file> --repo ggulati2/my-first-computer
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag and run all checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - name: Tag must match VERSION and be on main
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file (v$version). Update VERSION in a pull request first."; exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tagged commit is not on main."; exit 1; }
      - name: Install (exact versions and hashes from the lockfile)
        run: pip install --require-hashes -r requirements.lock
      - name: Run all checks
        run: scripts/check.sh

  zip:
    name: Build the source zip
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Build and check the zip
        run: |
          python scripts/make_zip.py
          scripts/check_zip.sh
          scripts/release_notes.sh "$(tr -d '[:space:]' < VERSION)" > release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: app-zip
          path: |
            Keybo-*.zip
            release-notes.md
          retention-days: 30

  mac:
    needs: verify
    uses: ./.github/workflows/mac-app.yml
  windows:
    needs: verify
    uses: ./.github/workflows/windows-app.yml
  linux:
    needs: verify
    uses: ./.github/workflows/linux-app.yml

  publish:
    name: Checksums, provenance and the draft release
    needs: [zip, mac, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release           # waits for the maintainer's approval (Settings, Environments)
    permissions:
      contents: write              # create the draft release
      id-token: write              # sign the provenance attestations
      attestations: write          # store them
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: app-*
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: |
          sha256sum Keybo-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            out/Keybo-*
            out/SHA256SUMS.txt
      - name: Create the draft release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=""; case "$version" in 0.*) flags="--prerelease";; esac     # versions below 1.0.0 are pre-releases
          gh release create "$GITHUB_REF_NAME" Keybo-* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --draft $flags --verify-tag --title "Keybo $version" --notes-file release-notes.md
          echo "Draft release created. Open it on GitHub and click Publish when you are ready." >> "$GITHUB_STEP_SUMMARY"
