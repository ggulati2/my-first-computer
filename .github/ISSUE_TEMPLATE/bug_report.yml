name: Something does not work
description: A game, screen or setting behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include your child's name or any personal details. For security problems use the private reporting link on the Security tab instead."
  - type: input
    id: version
    attributes:
      label: Keybo version
      description: The number in the `VERSION` file
    validations: { required: true }
  - type: input
    id: system
    attributes:
      label: Computer and browser
      placeholder: "macOS 15, Chrome 153"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Which world and level? Add a screenshot if you can.
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "In the parent area, open the Data tab and press **Copy diagnostics**, then paste it here. It has no child names or progress."
      render: text
  - type: textarea
    id: log
    attributes:
      label: Anything else from logs/app.log (optional)
      render: text
